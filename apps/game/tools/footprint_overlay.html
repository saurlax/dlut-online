<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>OSM 叠加官网俯视图</title>
<style>body{margin:0;font:15px system-ui;color:#172330}header{padding:12px 18px;background:#fff}h1{font-size:20px;margin:0 0 8px}label{display:inline-block;margin-right:16px}select,button,input{font:inherit}input[type=number]{width:75px}p{margin:8px 0}canvas{display:block;width:100%;height:calc(100vh - 210px);min-height:350px;background:#eee;touch-action:none}#details{padding:8px 18px}#status{font-size:13px;color:#526273}</style>
<header><h1>OSM 建筑叠加官网俯视图</h1><label>校区 <select id="campus"><option value="lingshui">凌水</option><option value="eda">开发区</option><option value="panjin">盘锦</option></select></label>
<label><input id="osm" type="checkbox" checked>OSM 蓝线</label><label><input id="official" type="checkbox">官网 bound 红线</label><label><input id="base" type="checkbox" checked>官网俯视底图</label><button id="reset">回到初始视图</button>
<p><label>预览微调，东向米 <input id="east" type="number" value="0" step="1"></label><label>北向米 <input id="north" type="number" value="0" step="1"></label>仅移动预览中的 OSM，不修改源数据。</p>
<p id="basis"></p><div id="status"></div></header><canvas id="map"></canvas><div id="details">滚轮缩放，拖动平移，点击建筑边线查看来源。© OpenStreetMap contributors, ODbL 1.0；官网瓦片仅作本地参考。</div>
<script>
const DATA=__DATA__,canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),tiles=new Map(),controls=Object.fromEntries(['campus','osm','official','base','east','north'].map(id=>[id,document.getElementById(id)]));
let campus,center,zoom=17,selected=null,drag=null;
function size(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;draw()}
function offset(){return[Number(controls.east.value||0)/campus.meters_per_pixel,-Number(controls.north.value||0)/campus.meters_per_pixel]}
function pixel(p,source){const f=2**(zoom-19),o=source==='osm'?offset():[0,0];return[(p[0]+o[0]-center[0])*f+canvas.width/2,(p[1]+o[1]-center[1])*f+canvas.height/2]}
function draw(){if(!campus)return;ctx.clearRect(0,0,canvas.width,canvas.height);const f=2**(zoom-19),tileZ=Math.max(16,Math.min(19,Math.floor(zoom))),ts=256*2**(19-tileZ),screen=ts*f,left=center[0]-canvas.width/2/f,top=center[1]-canvas.height/2/f;let pending=0,failed=0,total=0;
 if(controls.base.checked)for(let x=Math.floor(left/ts);x<=Math.floor((left+canvas.width/f)/ts);x++)for(let y=Math.floor(top/ts);y<=Math.floor((top+canvas.height/f)/ts);y++){const key=`${tileZ}/${x}/${y}`;total++;let t=tiles.get(key);if(!t){const img=new Image();t={img,state:'loading'};tiles.set(key,t);img.onload=()=>{t.state='ready';requestAnimationFrame(draw)};img.onerror=()=>{t.state='error';requestAnimationFrame(draw)};img.src='/tiles/'+key+'.png'}const a=pixel([x*ts,y*ts],'tile');if(t.state==='ready')ctx.drawImage(t.img,a[0],a[1],screen,screen);else{pending+=t.state==='loading';failed+=t.state==='error';ctx.strokeStyle='#ddd';ctx.strokeRect(a[0],a[1],screen,screen)}}
 for(const r of campus.records){if(!controls[r.source].checked)continue;for(const path of r.paths){ctx.beginPath();path.points.forEach((p,i)=>{const a=pixel(p,r.source);ctx[i?'lineTo':'moveTo'](...a)});ctx.closePath();ctx.strokeStyle=r===selected?'#f39c00':r.source==='osm'?'#0873ed':'#e33c42';ctx.lineWidth=r===selected?3:1.7;ctx.setLineDash(path.role==='inner'?[5,3]:[]);ctx.stroke()}}ctx.setLineDash([]);
 document.getElementById('status').textContent=`缩放 ${zoom.toFixed(1)}，当前瓦片 ${total}，加载中 ${pending}，失败 ${failed}。蓝线位置为初始配准，尚未确认墙脚及绝对精度。`;
}
function load(){campus=DATA[controls.campus.value];center=[...campus.center];zoom=17;selected=null;controls.east.value=controls.north.value=0;document.getElementById('basis').textContent='定位依据：'+campus.alignment.status+'。盘锦仅由 D03 单栋平移推算全图，偏差需逐栋检查。';size()}
const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),old=2**(zoom-19),next=Math.max(16,Math.min(19,zoom-Math.sign(e.deltaY)*.25)),f=2**(next-19);center[0]+=(p[0]-canvas.width/2)*(1/old-1/f);center[1]+=(p[1]-canvas.height/2)*(1/old-1/f);zoom=next;draw()},{passive:false});
canvas.onpointerdown=e=>{drag={start:pos(e),last:pos(e),moved:false};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const p=pos(e),f=2**(zoom-19);if(Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1])>4)drag.moved=true;center[0]-=(p[0]-drag.last[0])/f;center[1]-=(p[1]-drag.last[1])/f;drag.last=p;draw()};
function distance(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],q=dx*dx+dy*dy,t=q?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/q)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
canvas.onpointerup=e=>{if(drag&&!drag.moved){const p=pos(e);let best=8;selected=null;for(const r of campus.records){if(!controls[r.source].checked)continue;for(const path of r.paths)for(let i=0;i<path.points.length;i++){const d=distance(p,pixel(path.points[i],r.source),pixel(path.points[(i+1)%path.points.length],r.source));if(d<best){best=d;selected=r}}}document.getElementById('details').textContent=selected?`${selected.name||'未命名'} | ${selected.source} ${selected.id} | ${selected.url}`:'附近没有可选边线';draw()}drag=null};canvas.onpointercancel=()=>drag=null;
controls.campus.onchange=load;for(const key of ['osm','official','base','east','north'])controls[key].oninput=draw;document.getElementById('reset').onclick=load;window.onresize=size;load();
</script></html>
