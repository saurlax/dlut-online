apiVersion: v1
kind: Namespace
metadata:
  name: dlut-online
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dlut-online-data
  namespace: dlut-online
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlut-online
  namespace: dlut-online
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dlut-online
  template:
    metadata:
      labels:
        app: dlut-online
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: configure-oidc
          image: docker.io/local/dlut-online:example
          imagePullPolicy: Never
          command: [/app/dlut-online]
          args: [configure-oidc, --file=/run/oidc/provider.json, --dir=/data/pb_data]
          volumeMounts:
            - name: data
              mountPath: /data/pb_data
            - name: oidc
              mountPath: /run/oidc
              readOnly: true
      containers:
        - name: dlut-online
          image: docker.io/local/dlut-online:example
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8415
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/pb_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dlut-online-data
        - name: oidc
          secret:
            secretName: dlut-online-oidc
---
apiVersion: v1
kind: Service
metadata:
  name: dlut-online
  namespace: dlut-online
spec:
  selector:
    app: dlut-online
  ports:
    - name: http
      port: 8415
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dlut-online
  namespace: dlut-online
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: game.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dlut-online
                port:
                  name: http
