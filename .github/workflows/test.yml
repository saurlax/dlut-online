name: Test

on:
  workflow_call:
    outputs:
      web:
        description: Whether Web/API build inputs changed
        value: ${{ jobs.test.outputs.web }}
      game:
        description: Whether Game/API build inputs changed
        value: ${{ jobs.test.outputs.game }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.scope.outputs.web }}
      game: ${{ steps.scope.outputs.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Select affected builds
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          web=false
          game=false
          if [[ "$EVENT_NAME" == workflow_dispatch || "$REF_TYPE" == tag || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            web=true
            game=true
          else
            git fetch --no-tags --depth=1 origin "$BASE"
            git diff --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                *.md) continue ;;
                apps/api/*|.github/workflows/*|.dockerignore|.gitattributes) web=true; game=true ;;
                apps/web/*) web=true ;;
                apps/game/*) game=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "game=$game" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Type-check Vue
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vue-tsc --noEmit
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test and vet Go units
        working-directory: apps/api
        run: |
          # Satisfy go:embed without building or testing the website in this job.
          # Build jobs use clean checkouts and generate the real website in Docker.
          mkdir -p static
          printf 'Unit-check embed placeholder\n' > static/ci-placeholder.txt
          go test -timeout 60s ./...
          go vet ./...
