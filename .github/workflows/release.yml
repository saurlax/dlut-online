name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease'
            exit 1
          }
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    secrets:
      DO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DO_ANDROID_KEYSTORE_BASE64 }}
    with:
      release: true
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-windows-${{ github.sha }}
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: client-macos-${{ github.sha }}
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: client-android-release-${{ github.sha }}
          path: dist/android
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GH_REPO,,}"
          printf 'Go HTTP Docker: `%s`\nGodot game Docker: `%s`\n\nWindows x86_64, macOS arm64 and an Android arm64 test APK are attached. The APK uses a fixed test signing key and is not an app-store release. Windows EXE is unsigned. macOS DMG contains an ad-hoc signed app, without Developer ID signing or Apple notarization; Gatekeeper may block browser downloads.\n' "${image}-web:$TAG" "$image:$TAG" > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--verify-tag --title "$TAG" --notes-file notes.md)
            if [[ "$TAG" == *-* ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" dist/windows/DLUT-Online-Windows.exe dist/macos/DLUT-Online-macOS.dmg dist/android/DLUT-Online-Android.apk --clobber
