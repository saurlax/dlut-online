name: Build Web

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch website media
        run: git lfs pull --include="apps/web/**"
      - uses: docker/setup-buildx-action@v3
      - name: Build Go Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/web-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          docker load --input "$RUNNER_TEMP/web-image.tar"
          image="ghcr.io/${REPOSITORY,,}"
          source="dlut-online-web:$COMMIT_SHA"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "$source" "${image}-web:$tag"
            docker push "${image}-web:$tag"
          done
