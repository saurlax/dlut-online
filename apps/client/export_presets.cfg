html/head_include="<style>\n#status { background:#111b20; }\n#status-splash { display:none !important; }\n#status::before { content:'DLUT Online'; color:#edf0e5; font:500 clamp(32px,6vw,56px) system-ui,sans-serif; letter-spacing:0.04em; }\n#status-progress { position:relative; left:auto; right:auto; bottom:auto; width:min(320px,70vw); height:4px; margin:32px auto 0; border:0; border-radius:3px; overflow:hidden; appearance:none; background:#2b393f; accent-color:#d3e1bb; }\n#status-progress::-webkit-progress-bar { background:#2b393f; }\n#status-progress::-webkit-progress-value { background:#d3e1bb; border-radius:3px; }\n#status-progress::-moz-progress-bar { background:#d3e1bb; }\n#status-notice { margin-top:28px; }\n#status-bytes { margin-top:14px; color:#d3e1bb; font:14px system-ui,sans-serif; font-variant-numeric:tabular-nums; }\n</style>\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n    const progress = document.getElementById('status-progress');\n    if (!progress || !progress.isConnected) return;\n    const label = document.createElement('div');\n    label.id = 'status-bytes';\n    progress.after(label);\n    const sizes = typeof GODOT_CONFIG !== 'undefined' ? GODOT_CONFIG.fileSizes : {};\n    const exportedTotal = Object.values(sizes || {}).reduce((sum, size) => sum + size, 0);\n    const update = () => {\n        const current = progress.hasAttribute('value') ? progress.value : 0;\n        const total = progress.hasAttribute('max') ? progress.max : exportedTotal;\n        const mb = bytes => (bytes / 1000000).toFixed(2);\n        label.textContent = total > 0\n            ? `${mb(current)} / ${mb(total)} MB · ${Math.min(100, current / total * 100).toFixed(0)}%`\n            : `${mb(current)} / -- MB · --%`;\n        label.style.display = progress.style.display;\n    };\n    new MutationObserver(update).observe(progress, { attributes: true, attributeFilter: ['value', 'max', 'style'] });\n    update();\n});\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

