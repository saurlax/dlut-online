name: Build DLUT Online

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/web/go.mod
          cache-dependency-path: apps/web/go.sum
      - name: Test and vet server
        working-directory: apps/web
        run: |
          go test -race ./...
          go vet ./...
      - name: Install Godot and export templates
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export game server, Windows and macOS
        env:
          DO_ENV: production
          DO_SERVER_URL: https://dlut.online
        working-directory: apps/game
        run: |
          godot --headless --editor --quit
          godot --headless --script tests/desktop_config.gd
          godot --headless --script tools/server_export/build_worlds.gd
          godot --headless --script tests/server_physics.gd
          godot --headless --script tests/game_protocol.gd
          (cd ../web && DO_TEST_GODOT_PROJECT=../game go test -race -run TestENet -timeout 3m -v)
          mkdir -p build/windows build/macos build/server
          godot --headless --export-release Server build/server/dlut-game-server.x86_64
          godot --headless --main-pack build/server/dlut-game-server.pck --script "$GITHUB_WORKSPACE/apps/game/tests/server_export.gd"
          godot --headless --export-release Windows "build/windows/DLUT Online.exe"
          godot --headless --export-release macOS "build/macos/DLUT Online.zip"
          unzip -p 'build/macos/DLUT Online.zip' 'DLUT Online.app/Contents/Resources/DLUT Online.pck' > "$RUNNER_TEMP/desktop.pck"
          godot --headless --main-pack "$RUNNER_TEMP/desktop.pck" --script "$GITHUB_WORKSPACE/apps/game/tests/desktop_export.gd"
          cd build/windows
          zip -r "../DLUT-Online-Windows.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-${{ github.sha }}
          path: apps/game/build/DLUT-Online-Windows.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ github.sha }}
          path: apps/game/build/macos/DLUT Online.zip
          retention-days: 7
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - name: Build Go HTTP server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/server-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Godot game server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game/tools/server_export/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-game:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/game-image.tar
          cache-from: type=gha,scope=game
          cache-to: type=gha,mode=max,scope=game
      - name: Check desktop ENet clients and two services
        env:
          IMAGE: dlut-online-server:${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/server-image.tar"
          export DO_GAME_SERVICE_TOKEN="$(openssl rand -hex 32)"
          export DO_ADMIN_API_TOKEN="$(openssl rand -hex 32)"
          docker network create game-check
          docker load --input "$RUNNER_TEMP/game-image.tar"
          docker run -d --name game-check --network game-check -e DO_GAME_SERVICE_TOKEN -e DO_API_SERVER_URL=http://server-check:9090 -p 127.0.0.1:9061:8061/udp "dlut-online-game:${{ github.sha }}"
          docker run -d --name server-check --network game-check -e PORT=9090 -e DO_GAME_SERVICE_TOKEN -e DO_ADMIN_API_TOKEN -e DO_GAME_SERVER_URL=enet://127.0.0.1:9061 -p 127.0.0.1:9090:9090 "$IMAGE"
          trap 'docker logs server-check; docker logs game-check; docker rm -f server-check game-check; docker network rm game-check' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:9090/
          DO_SERVER_URL=http://127.0.0.1:9090 godot --headless --path apps/game --script tests/enet_protocol.gd
          DO_SERVER_URL=http://127.0.0.1:9090 godot --headless --path apps/game --script tests/campus_travel.gd
          DO_SERVER_URL=http://127.0.0.1:9090 godot --headless --path apps/game --script tests/campus_transfer.gd
          DO_SERVER_URL=http://127.0.0.1:9090 godot --headless --path apps/game --script tests/player_network.gd
          curl --fail http://127.0.0.1:9090/api/v1/game/online
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/web/)" = 404
      - uses: actions/upload-artifact@v4
        with:
          name: server-image-${{ github.sha }}
          path: ${{ runner.temp }}/server-image.tar
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: game-image-${{ github.sha }}
          path: ${{ runner.temp }}/game-image.tar
          retention-days: 7
          if-no-files-found: error
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          source="dlut-online-server:$COMMIT_SHA"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "$source" "$image:$tag"
            docker push "$image:$tag"
            docker tag "dlut-online-game:$COMMIT_SHA" "$image-game:$tag"
            docker push "$image-game:$tag"
          done
