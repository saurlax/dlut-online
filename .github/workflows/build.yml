name: Build

on:
  push:
    branches: ["main"]
    paths:
      - "CREDITS.md"
      - "apps/**"
      - "!apps/**/*.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".gitattributes"
  pull_request:
    paths:
      - "CREDITS.md"
      - "apps/**"
      - "!apps/**/*.md"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "compose.yaml"
      - ".dockerignore"
      - ".gitattributes"
  workflow_dispatch:
  workflow_call:
    secrets:
      DO_ANDROID_KEYSTORE_BASE64:
        description: Fixed Android test keystore encoded as Base64
        required: false
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game: ${{ steps.targets.outputs.game }}
      web: ${{ steps.targets.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select application builds
        id: targets
        env:
          DO_RELEASE_BUILD: ${{ inputs.release || false }}
        run: python3 .github/scripts/build_targets.py

  test:
    uses: ./.github/workflows/test.yml

  windows:
    needs: [changes, test]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot and export templates
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export and verify Windows EXE
        env:
          DO_ENV: production
          DO_API_SERVER_URL: https://dlut.online
        working-directory: apps/game
        run: |
          python3 tools/run_godot.py --headless --editor --quit
          mkdir -p build/windows
          python3 tools/run_godot.py --headless --export-release Windows build/windows/DLUT-Online-Windows.exe
          python3 tools/verify_windows_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-${{ github.sha }}
          path: apps/game/build/windows/DLUT-Online-Windows.exe
          retention-days: 7
          if-no-files-found: error

  android:
    needs: [changes, test]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Restore Android signing key
        id: signing
        env:
          DO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DO_ANDROID_KEYSTORE_BASE64 }}
          DO_ALLOW_TEMPORARY_SIGNING: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          if [[ -n "$DO_ANDROID_KEYSTORE_BASE64" ]]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$DO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            test -s "$HOME/.android/debug.keystore"
            echo 'description=使用仓库 Secrets 中的固定测试签名，可覆盖安装使用同一密钥的版本。' >> "$GITHUB_OUTPUT"
          elif [[ "$DO_ALLOW_TEMPORARY_SIGNING" == 'true' ]]; then
            echo 'description=外部 fork 或 Dependabot PR 无法读取签名 Secret，本次使用临时测试签名；安装时可能需要卸载旧版。' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Missing repository secret DO_ANDROID_KEYSTORE_BASE64'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Install Godot and Android export templates
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android_source.zip' -d "$RUNNER_TEMP/godot-templates"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          mv "$RUNNER_TEMP/godot-templates/templates/android_source.zip" "$templates/"
      - name: Export and verify Android test APK
        env:
          DO_ENV: production
          DO_API_SERVER_URL: https://dlut.online
        run: python3 apps/game/tools/export_android.py --sdk "$ANDROID_HOME" --java "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: client-android-release-${{ github.sha }}
          path: apps/game/build/android/DLUT-Online-Android.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Add APK download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          DO_SIGNING_DESCRIPTION: ${{ steps.signing.outputs.description }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Android arm64 测试 APK

          [下载 APK artifact]($ARTIFACT_URL)，解压后安装其中的 APK。下载需登录 GitHub，保留 7 天。

          $DO_SIGNING_DESCRIPTION 卸载会清除本地数据。固定密钥沿用现有 debug keystore，仍是测试签名。

          当前为 Release 测试包，默认连接 https://dlut.online，尚未通过 Android 真机性能及联网验收，不用于应用商店发行。
          EOF

  macos:
    needs: [changes, test]
    if: needs.changes.outputs.game == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot and macOS export template
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/macos.zip' -d "$RUNNER_TEMP/godot-templates"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          mv "$RUNNER_TEMP/godot-templates/templates/macos.zip" "$templates/"
      - name: Export, ad-hoc sign and verify macOS DMG
        env:
          DO_ENV: production
          DO_API_SERVER_URL: https://dlut.online
        working-directory: apps/game
        run: |
          python3 tools/run_godot.py --headless --editor --quit
          mkdir -p build/macos
          python3 tools/run_godot.py --headless --export-release macOS 'build/macos/DLUT Online.app'
          python3 tools/package_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ github.sha }}
          path: apps/game/build/macos/DLUT-Online-macOS.dmg
          retention-days: 7
          if-no-files-found: error

  server:
    needs: [changes, test]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot and export templates
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Generate collision worlds and export server
        working-directory: apps/game
        run: |
          python3 tools/run_godot.py --headless --editor --quit
          python3 tools/run_godot.py --headless --script tools/server_export/build_worlds.gd
          mkdir -p build/server
          python3 tools/run_godot.py --headless --export-release Server build/server/dlut-online-server.x86_64
      - uses: docker/setup-buildx-action@v3
      - name: Build Godot game server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game/tools/server_export/Dockerfile
          platforms: linux/amd64
          tags: dlut-online:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/game-image.tar
          cache-from: type=gha,scope=game
          cache-to: type=gha,mode=max,scope=game
      - uses: actions/upload-artifact@v4
        with:
          name: game-image-${{ github.sha }}
          path: ${{ runner.temp }}/game-image.tar
          retention-days: 7
          if-no-files-found: error
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish game image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          docker load --input "$RUNNER_TEMP/game-image.tar"
          image="ghcr.io/${REPOSITORY,,}"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "dlut-online:$COMMIT_SHA" "$image:$tag"
            docker push "$image:$tag"
          done

  web:
    needs: [changes, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch website media
        run: git lfs pull --include="apps/web/**"
      - uses: docker/setup-buildx-action@v3
      - name: Build Go Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/web-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          docker load --input "$RUNNER_TEMP/web-image.tar"
          image="ghcr.io/${REPOSITORY,,}"
          source="dlut-online-web:$COMMIT_SHA"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "$source" "${image}-web:$tag"
            docker push "${image}-web:$tag"
          done
