name: Build Game

on:
  push:
    branches: ["**"]
    paths:
      - "apps/game/**"
      - "!apps/game/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-game.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  pull_request:
    paths:
      - "apps/game/**"
      - "!apps/game/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-game.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot and export templates
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export game server, Windows and macOS
        env:
          DO_ENV: production
          DO_API_SERVER_URL: https://dlut.online
        working-directory: apps/game
        run: |
          godot() { python3 "$GITHUB_WORKSPACE/apps/game/tools/run_godot.py" "$@"; }
          godot --headless --editor --quit
          godot --headless --script tests/desktop_config.gd
          godot --headless --script tools/server_export/build_worlds.gd
          godot --headless --script tests/server_physics.gd
          godot --headless --script tests/game_protocol.gd
          mkdir -p build/windows build/macos build/server
          godot --headless --export-release Server build/server/dlut-online-server.x86_64
          mkdir -p "$RUNNER_TEMP/pack-check"
          (cd "$RUNNER_TEMP/pack-check" && godot --headless --main-pack "$GITHUB_WORKSPACE/apps/game/build/server/dlut-online-server.pck" --script "$GITHUB_WORKSPACE/apps/game/tests/server_export.gd")
          godot --headless --export-release Windows "build/windows/DLUT Online.exe"
          godot --headless --export-release macOS "build/macos/DLUT Online.zip"
          unzip -p 'build/macos/DLUT Online.zip' 'DLUT Online.app/Contents/Resources/DLUT Online.pck' > "$RUNNER_TEMP/desktop.pck"
          (cd "$RUNNER_TEMP/pack-check" && godot --headless --main-pack "$RUNNER_TEMP/desktop.pck" --script "$GITHUB_WORKSPACE/apps/game/tests/desktop_export.gd")
          cd build/windows
          zip -r "../DLUT-Online-Windows.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-${{ github.sha }}
          path: apps/game/build/DLUT-Online-Windows.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ github.sha }}
          path: apps/game/build/macos/DLUT Online.zip
          retention-days: 7
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - name: Build Godot game server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game/tools/server_export/Dockerfile
          platforms: linux/amd64
          tags: dlut-online:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/game-image.tar
          cache-from: type=gha,scope=game
          cache-to: type=gha,mode=max,scope=game
      - uses: actions/upload-artifact@v4
        with:
          name: game-image-${{ github.sha }}
          path: ${{ runner.temp }}/game-image.tar
          retention-days: 7
          if-no-files-found: error
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish game image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          docker load --input "$RUNNER_TEMP/game-image.tar"
          image="ghcr.io/${REPOSITORY,,}"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "dlut-online:$COMMIT_SHA" "$image:$tag"
            docker push "$image:$tag"
          done
