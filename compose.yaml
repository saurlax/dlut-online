services:
  web:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${DO_API_SERVER_PORT:-8415}:${DO_API_SERVER_PORT:-8415}"
    environment:
      DO_ENV: ${DO_ENV:-development}
      DO_API_SERVER_PORT: ${DO_API_SERVER_PORT:-8415}
      DO_API_KEY: ${DO_API_KEY:?set a random API key}
      DO_WEATHER_REFRESH_MINUTES: ${DO_WEATHER_REFRESH_MINUTES:-15}
      DO_WEATHER_API_KEY: ${DO_WEATHER_API_KEY:-}
      PB_DATA_DIR: ${PB_DATA_DIR:-/data/pb_data}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
    volumes:
      - web-data:/data
    networks:
      default:
        aliases: [web.internal]
    restart: unless-stopped
  game:
    ports:
      - "127.0.0.1:${DO_GAME_SERVER_PORT:-1949}:${DO_GAME_SERVER_PORT:-1949}/udp"
    build:
      context: .
      dockerfile: apps/game/tools/server_export/Dockerfile
    environment:
      DO_ENV: ${DO_ENV:-development}
      DO_API_SERVER_URL: http://web.internal:${DO_API_SERVER_PORT:-8415}
      DO_API_KEY: ${DO_API_KEY:?set the same API key as web}
      DO_GAME_SERVER_PORT: ${DO_GAME_SERVER_PORT:-1949}
      DO_GAME_TLS_CERT: ${DO_GAME_TLS_CERT:-}
      DO_GAME_TLS_KEY: ${DO_GAME_TLS_KEY:-}
    volumes:
      - "./.local/game-tls:/run/game-tls:ro"
    restart: unless-stopped

volumes:
  web-data:
