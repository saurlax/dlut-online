name: Build Web

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "!apps/web/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-web.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  pull_request:
    paths:
      - "apps/web/**"
      - "!apps/web/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-web.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Type-check Vue
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vue-tsc --noEmit
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test and vet Go units
        working-directory: apps/api
        run: |
          # Satisfy go:embed without building or testing the website in this job.
          # Build jobs use clean checkouts and generate the real website in Docker.
          mkdir -p static
          printf 'Unit-check embed placeholder\n' > static/ci-placeholder.txt
          go test -timeout 60s ./...
          go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch website media
        run: git lfs pull --include="apps/web/**"
      - uses: docker/setup-buildx-action@v3
      - name: Build Go Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/web-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web image to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          docker load --input "$RUNNER_TEMP/web-image.tar"
          image="ghcr.io/${REPOSITORY,,}"
          source="dlut-online-web:$COMMIT_SHA"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "$source" "${image}-web:$tag"
            docker push "${image}-web:$tag"
          done
