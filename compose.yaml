services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${DO_HTTP_BIND:-127.0.0.1}:${DO_HTTP_PORT:-8060}:8060"
    environment:
      PORT: "8060"
      DO_GAME_SERVER_URL: http://game:8061
      DO_GAME_SERVICE_TOKEN: ${DO_GAME_SERVICE_TOKEN:?set a random service token}
      DO_ADMIN_API_TOKEN: ${DO_ADMIN_API_TOKEN:?set a different random admin token}
    networks:
      default:
        aliases: [api.internal]
    restart: unless-stopped
  game:
    build:
      context: .
      dockerfile: apps/client/tools/server_export/Dockerfile
    environment:
      DO_API_SERVER_URL: http://api.internal:8060
      DO_GAME_SERVICE_TOKEN: ${DO_GAME_SERVICE_TOKEN:?set a random service token}
      DO_GAME_INSTANCE_ID: main
    restart: unless-stopped
