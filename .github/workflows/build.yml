name: Checks

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - Dockerfile
      - .dockerignore
      - .gitattributes
      - compose.yaml
      - .github/workflows/**
  pull_request:
    paths:
      - apps/**
      - Dockerfile
      - .dockerignore
      - .gitattributes
      - compose.yaml
      - .github/workflows/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
