name: Build Web

on:
  push:
    branches: ["**"]
    paths:
      - "apps/web/**"
      - "!apps/web/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-web.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  pull_request:
    paths:
      - "apps/web/**"
      - "!apps/web/**/*.md"
      - "apps/api/**"
      - "!apps/api/**/*.md"
      - ".github/workflows/build-web.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".gitattributes"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch website media
        run: git lfs pull --include="apps/web/**"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build Vue website
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test and vet Go Web
        working-directory: apps/api
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v3
      - name: Build Go Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          tags: dlut-online-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/web-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check Web container
        run: |
          docker load --input "$RUNNER_TEMP/web-image.tar"
          export DO_API_KEY="$(openssl rand -hex 32)"
          docker run -d --name web-check -e DO_API_KEY -e DO_API_SERVER_PORT=9090 -p 127.0.0.1:9090:9090 "dlut-online-web:${{ github.sha }}"
          trap 'docker logs web-check; docker rm -f web-check' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:9090/
          curl --fail http://127.0.0.1:9090/download
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/web/)" = 404
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images to GHCR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          source="dlut-online-web:$COMMIT_SHA"
          tags=("sha-$COMMIT_SHA")
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            tags+=("$REF_NAME")
            if [[ "$REF_NAME" != *-* ]]; then tags+=(latest); fi
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag "$source" "${image}-web:$tag"
            docker push "${image}-web:$tag"
          done
